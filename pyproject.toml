[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proto_db"
version = "2.0.0rc4"
description = "proto_db is an embedded, transactional, object-oriented database for Python."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Gustavo Marino", email = "gamarino@numaes.com" }
]
keywords = ["database", "embedded", "transactional", "object-oriented", "ACID", "ORM-free", "NoSQL"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "msgpack>=1.2.0",
]

[project.optional-dependencies]
parquet = ["pyarrow"]
vectors = ["numpy"]
hnsw = ["numpy", "hnswlib"]
s3 = ["boto3"]
gcs = ["google-cloud-storage"]
dev = [
  "pytest",
  "pytest-timeout",
  "pytest-cov",
  "hypothesis",
  "sphinx",
  "build",
  "twine",
]

[project.urls]
Homepage = "https://github.com/gamarino/ProtoDB"
"Bug Tracker" = "https://github.com/gamarino/ProtoDB/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["proto_db*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
# Stop the process on an overrun instead of raising in the main thread: on CPython 3.14 the raised exception
# can leave a lock held, and test threads left running slowed every later test (CI-314).
timeout_method = "thread"
