name: Publish to PyPI (Trusted Publishing)

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC-based trusted publishing
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build distributions
        run: |
          python -m build

      # Where a release goes is decided by the release's own pre-release flag,
      # the one set when publishing it on GitHub. Deliberately not inferred from
      # the tag name: the workflow this replaced looked for the letter "a"
      # anywhere in the tag, so any tag containing one went to TestPyPI.
      - name: Publish to TestPyPI (pre-releases)
        if: github.event.release.prerelease
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Publish to PyPI (stable releases)
        if: ${{ ! github.event.release.prerelease }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
